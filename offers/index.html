<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- ====== SEO ====== -->
  <title>Gradeo Offer – FREE 1 YEAR</title>
  <meta name="description" content="Claim the Gradeo FREE 1 YEAR offer. Tap to open." />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <link rel="canonical" href="https://YOUR_SHORT_PAGE_URL" />

  <!-- ====== Link Preview: Open Graph (WhatsApp/FB/LinkedIn/etc.) ====== -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gradeo" />
  <meta property="og:title" content="Gradeo Offer – FREE 1 YEAR" />
  <meta property="og:description" content="Claim the Gradeo FREE 1 YEAR offer. Tap to open." />
  <meta property="og:url" content="https://YOUR_SHORT_PAGE_URL" />
  <meta property="og:image" content="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770299435/BANNER_vyrhbc.png" />
  <meta property="og:image:secure_url" content="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770299435/BANNER_vyrhbc.png" />
  <meta property="og:image:alt" content="Gradeo FREE 1 YEAR offer banner" />

  <!-- Optional but recommended if your banner is 1200x630 -->
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- ====== Link Preview: Twitter Card ====== -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gradeo Offer – FREE 1 YEAR" />
  <meta name="twitter:description" content="Claim the Gradeo FREE 1 YEAR offer. Tap to open." />
  <meta name="twitter:image" content="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770299435/BANNER_vyrhbc.png" />

  <!-- Optional UI polish -->
  <meta name="theme-color" content="#000000" />

  <!-- Prevent stale caching during updates -->
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="0" />

  <!-- Fallback redirect (bots/no-JS). Keep slightly longer than JS redirect. -->
  <meta http-equiv="refresh" content="3;url=https://gradeo.in/offer/?offer=FREE1YEAR&campaign=students&src=emai" />

  <style>
    :root { --vh: 1vh; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .stage {
      position: fixed;
      inset: 0;
      width: 100%;
      height: calc(var(--vh) * 100);
      overflow: hidden;
      background: #000;
    }

    /* One background video */
    #bgVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      pointer-events: none;
      object-position: center;
      object-fit: cover; /* desktop default */
    }

    /* Mobile: fit full video (no zoom) */
    @media (max-width: 768px) {
      #bgVideo { object-fit: contain; }
    }
  </style>
</head>

<body>
  <div class="stage">
    <video
      id="bgVideo"
      muted
      autoplay
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    ></video>
  </div>

  <script>
    // Fix mobile viewport height issues (address bar / notch)
    function setVh() {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    }
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', () => setTimeout(setVh, 120));

    // Videos
    const DESKTOP_VIDEO = "https://res.cloudinary.com/djy3mjtsz/video/upload/v1770327988/2_lnpdlu.mp4";
    const MOBILE_VIDEO  = "https://res.cloudinary.com/djy3mjtsz/video/upload/v1770328469/1_dnzumw.mp4";

    // Redirect after 2 seconds
    const REDIRECT_URL = "https://gradeo.in/offer/?offer=FREE1YEAR&campaign=students&src=emai";
    const REDIRECT_DELAY_MS = 2000;

    const mq = window.matchMedia("(max-width: 768px)");

    function setVideoSource() {
      const video = document.getElementById("bgVideo");
      if (!video) return;

      const chosen = mq.matches ? MOBILE_VIDEO : DESKTOP_VIDEO;

      // Don’t reload if already correct
      if (video.dataset.currentSrc === chosen) return;
      video.dataset.currentSrc = chosen;

      // Replace source
      video.pause();
      video.innerHTML = "";

      const source = document.createElement("source");
      source.src = chosen;
      source.type = "video/mp4";
      video.appendChild(source);

      video.load();

      // Try autoplay (mobile may still block in some cases)
      video.muted = true;
      const p = video.play();
      if (p && p.catch) p.catch(() => {});
    }

    setVideoSource();

    // Update on resize/orientation changes that cross breakpoint
    if (mq.addEventListener) mq.addEventListener("change", setVideoSource);
    else mq.addListener(setVideoSource); // older Safari

    // Redirect
    window.addEventListener("load", () => {
      setTimeout(() => window.location.replace(REDIRECT_URL), REDIRECT_DELAY_MS);
    });
  </script>
</body>
</html>
