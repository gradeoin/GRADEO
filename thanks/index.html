<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Thank you — Gradeo</title>
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#FF7A00" />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{--orange:#FF7A00;--bg:#FFF7F1;--ink:#121212;--muted:#5B5B5B;}
    @media (prefers-color-scheme: dark){:root{--bg:#0B0B10;--ink:#F2F2F2;--muted:#B7B7C2;}}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background:var(--bg);color:var(--ink);} 
    .card{width:min(640px,100%);background:rgba(255,255,255,.92);border:1px solid rgba(255,122,0,.22);border-radius:22px;padding:22px;text-align:center;}
    @media (prefers-color-scheme: dark){.card{background:rgba(18,18,26,.92);}}
    .logo{height:48px;width:auto;display:block;margin:0 auto;}
    h1{margin:16px 0 6px;font-size:28px;font-weight:950;letter-spacing:-.3px}
    p{margin:0;color:var(--muted);line-height:1.75}
    a{display:inline-flex;margin-top:16px;padding:12px 16px;border-radius:14px;background:var(--orange);color:#fff;text-decoration:none;font-weight:950;}
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="https://res.cloudinary.com/djy3mjtsz/image/upload/v1769939762/Untitled_1_xht9gh.gif" alt="Gradeo" />
    <h1>Thank you! 💛</h1>
    <p>Your feedback has been received. We really appreciate your time.</p>
    <a href="https://gradeo.in/">Back to Gradeo</a>
  </div>
</body>
</html>
