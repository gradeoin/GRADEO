<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>No Internet — Gradeo</title>
<meta name="robots" content="noindex"/>
<script>
(function(){
  var t=localStorage.getItem('gradeo_theme');
  if(!t) t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.setAttribute('data-theme',t);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --o:#FF6A00;--bg:#FFF6ED;--surface:#fff;
  --text:#0D0C0B;--muted:#6B6560;--muted2:#A8A29E;
  --cb:rgba(255,106,0,.12);
}
[data-theme="dark"]{
  --bg:#080604;--surface:#161210;
  --text:#F5E8D8;--muted:#8A7E74;--muted2:#5A5450;
  --cb:rgba(255,106,0,.20);
}
html,body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* Gradient background */
body{
  background:
    radial-gradient(ellipse 120% 50% at 10% 20%,rgba(255,100,0,.10) 0%,transparent 60%),
    radial-gradient(ellipse 80% 40% at 90% 80%,rgba(255,160,60,.07) 0%,transparent 50%),
    var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;padding-top:max(24px,env(safe-area-inset-top));
  padding-bottom:max(24px,env(safe-area-inset-bottom));
  text-align:center;
}

/* Logo */
.logo{
  width:72px;height:72px;border-radius:20px;
  border:2px solid rgba(255,106,0,.20);
  overflow:hidden;margin:0 auto 28px;
  box-shadow:0 8px 24px rgba(255,100,0,.15);
}
.logo img{width:100%;height:100%;object-fit:cover;display:block;}

/* Signal icon */
.signal{
  width:80px;height:80px;margin:0 auto 24px;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.signal-ring{
  position:absolute;border-radius:50%;border:2px solid rgba(255,106,0,.15);
  animation:pulse 2s ease-in-out infinite;
}
.signal-ring:nth-child(1){width:80px;height:80px;animation-delay:0s;}
.signal-ring:nth-child(2){width:56px;height:56px;animation-delay:.3s;}
.signal-ring:nth-child(3){width:36px;height:36px;animation-delay:.6s;}
@keyframes pulse{
  0%,100%{transform:scale(1);opacity:.15;}
  50%{transform:scale(1.08);opacity:.35;}
}
.signal-icon{
  width:36px;height:36px;position:relative;z-index:1;
  background:rgba(255,106,0,.12);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(255,106,0,.25);
}
.signal-icon svg{width:18px;height:18px;stroke:var(--o);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}

.card{max-width:340px;width:100%;}

h1{
  font-size:26px;font-weight:900;letter-spacing:-.5px;
  margin-bottom:10px;color:var(--text);
}
.sub{
  font-size:14px;color:var(--muted);line-height:1.65;
  margin-bottom:32px;font-weight:500;
}

/* Cached items */
.cached{
  background:var(--surface);border:1.5px solid var(--cb);
  border-radius:16px;padding:16px;margin-bottom:20px;text-align:left;
}
.cached-title{font-size:11px;font-weight:800;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px;}
.cached-item{
  display:flex;align-items:center;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--cb);font-size:13px;font-weight:600;color:var(--text);
}
.cached-item:last-child{border-bottom:none;padding-bottom:0;}
.cached-dot{width:8px;height:8px;border-radius:50%;background:var(--o);flex-shrink:0;}
.cached-badge{margin-left:auto;font-size:10px;font-weight:700;color:var(--o);background:rgba(255,106,0,.10);border:1px solid rgba(255,106,0,.20);padding:2px 8px;border-radius:99px;}

/* Buttons */
.btn-primary{
  width:100%;padding:15px;background:var(--o);color:#fff;
  border:none;border-radius:14px;font-size:15px;font-weight:800;
  cursor:pointer;font-family:inherit;
  box-shadow:0 4px 16px rgba(255,106,0,.30);
  transition:transform .15s,opacity .15s;
  margin-bottom:10px;
}
.btn-primary:active{transform:scale(.97);opacity:.88;}
.btn-secondary{
  width:100%;padding:13px;background:transparent;color:var(--muted);
  border:1.5px solid var(--cb);border-radius:14px;font-size:14px;
  font-weight:700;cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s;
}
.btn-secondary:active{border-color:var(--o);color:var(--text);}

/* Tips */
.tips{margin-top:28px;text-align:left;}
.tip{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--cb);
  font-size:13px;color:var(--muted);line-height:1.5;font-weight:500;
}
.tip:last-child{border-bottom:none;}
.tip-num{
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,106,0,.10);border:1px solid rgba(255,106,0,.20);
  color:var(--o);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}

/* Status */
#status{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:var(--muted2);
  margin-bottom:24px;padding:5px 12px;border-radius:99px;
  background:var(--surface);border:1px solid var(--cb);
}
.status-dot{width:7px;height:7px;border-radius:50%;background:#EF4444;animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
</style>
</head>
<body>

<div class="logo">
  <img src="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770296454/Untitled-2_i2ezfh.png" alt="Gradeo" decoding="async"/>
</div>

<div class="card">

  <div class="signal">
    <div class="signal-ring"></div>
    <div class="signal-ring"></div>
    <div class="signal-ring"></div>
    <div class="signal-icon">
      <svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
  </div>

  <div id="status"><span class="status-dot"></span> Offline</div>

  <h1>No internet</h1>
  <p class="sub">You're not connected. Check your Wi-Fi or mobile data and try again.</p>

  <div class="cached" id="cachedSection" style="display:none;">
    <div class="cached-title">Available offline</div>
    <div class="cached-item"><span class="cached-dot"></span>Home page<span class="cached-badge">Cached</span></div>
    <div class="cached-item" id="calcCached" style="display:none;"><span class="cached-dot"></span>Calculator<span class="cached-badge">Cached</span></div>
  </div>

  <button class="btn-primary" onclick="tryReload()">Try again</button>
  <button class="btn-secondary" onclick="goHome()">Go to home</button>

  <div class="tips">
    <div class="tip"><div class="tip-num">1</div>Check your Wi-Fi or mobile data is turned on</div>
    <div class="tip"><div class="tip-num">2</div>Move closer to your router if signal is weak</div>
    <div class="tip"><div class="tip-num">3</div>Turn airplane mode on then off to reset connection</div>
  </div>

</div>

<script>
/* Check if cached pages are available */
async function checkCache(){
  if(!('caches' in window)) return;
  try {
    const keys = await caches.keys();
    const pageCache = keys.find(k => k.includes('pages'));
    if(pageCache){
      const cache = await caches.open(pageCache);
      const calc = await cache.match('/calculator/');
      if(calc) document.getElementById('calcCached').style.display='flex';
      document.getElementById('cachedSection').style.display='block';
    }
  } catch(_){}
}
checkCache();

function tryReload(){
  const btn = document.querySelector('.btn-primary');
  btn.textContent = 'Checking...';
  btn.style.opacity = '.7';
  /* Try fetching a tiny resource to check connectivity */
  fetch('https://gradeo.in/manifest.webmanifest?_=' + Date.now(), {cache:'no-store'})
    .then(() => location.href = '/')
    .catch(() => {
      btn.textContent = 'Still offline — try again';
      btn.style.opacity = '1';
      setTimeout(() => btn.textContent = 'Try again', 2500);
    });
}

function goHome(){
  /* Try to serve from cache */
  location.href = '/';
}

/* Auto-reload when connection restored */
window.addEventListener('online', () => {
  document.getElementById('status').innerHTML = '<span style="width:7px;height:7px;border-radius:50%;background:#22C55E;display:inline-block;"></span> Back online — reloading...';
  setTimeout(() => location.href = '/', 800);
});
</script>
</body>
</html>
