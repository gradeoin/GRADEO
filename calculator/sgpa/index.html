<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <title>SGPA Calculator — GRADEO</title>
    
    <!-- Site Favicons -->
    <link rel="icon" href="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770296454/Untitled-2_i2ezfh.png" type="image/png"/>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* ══ GRADEO OFFICIAL TOKENS ══ */
        :root {
            --o: #FF6A00; --od: #E05500;
            --bg: #FFF6ED; --surface: #fff;
            --text: #0D0C0B; --muted: #6B6560; --muted2: #A8A29E;
            --cb: rgba(255,106,0,.11);
            --ib: rgba(255,130,30,.11); --id: rgba(255,106,0,.18);
            --r: 20px; --r2: 16px;
            --ease: cubic-bezier(.4, 0, .2, 1);
            --sp: cubic-bezier(.34, 1.56, .64, 1);
        }

        [data-theme="dark"] {
            --bg: #080604; --surface: #161210;
            --text: #F5E8D8; --muted: #8A7E74; --muted2: #5A5450;
            --cb: rgba(255,106,0,.22);
            --ib: rgba(255,106,0,.14); --id: rgba(255,106,0,.28);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── Header ── */
        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--cb);
            padding: 12px 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
        .lw { 
            width: 32px; height: 32px; border-radius: 10px; overflow: hidden; 
            border: 1.5px solid var(--id); box-shadow: 0 2px 8px rgba(255,106,0,.14);
            transition: transform .3s var(--sp);
        }
        .lw:hover { transform: rotate(8deg) scale(1.1); }
        .lw img { width: 100%; height: 100%; object-fit: cover; }
        .bn { font-size: 14px; font-weight: 900; letter-spacing: -.4px; }

        /* ── Layout ── */
        .container { max-width: 1120px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-title { font-size: clamp(24px, 8vw, 42px); font-weight: 950; letter-spacing: -1.5px; margin-bottom: 8px; }
        .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 2rem; }

        .app-grid { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; }
        @media (max-width: 1024px) { .app-grid { grid-template-columns: 1fr; } }

        /* ── Components ── */
        .card { 
            background: var(--surface); border: 1.5px solid var(--cb); border-radius: var(--r);
            padding: 1.5rem; box-shadow: 0 4px 20px rgba(255,80,0,.05);
        }

        .subject-card {
            background: var(--bg); border: 1.5px solid var(--cb); border-radius: 16px;
            padding: 1rem; display: grid; grid-template-columns: 1fr auto auto auto auto;
            gap: 1rem; align-items: center; margin-bottom: 12px;
            transition: transform .2s var(--sp);
        }
        .subject-card:hover { transform: translateY(-2px); }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
        
        input {
            background: var(--surface); border: 1.5px solid var(--cb); border-radius: 8px;
            padding: 8px 12px; color: var(--text); font-weight: 700; font-size: 14px;
            width: 70px; outline: none; transition: border-color .2s;
        }
        input:focus { border-color: var(--o); }
        input.name { width: 100%; }

        /* ── Result Card ── */
        .res-card {
            background: linear-gradient(135deg, var(--surface), var(--bg));
            text-align: center; padding: 2.5rem 1.5rem;
        }
        .res-val { font-size: 4.5rem; font-weight: 950; color: var(--o); letter-spacing: -3px; line-height: 1; }
        .res-lbl { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }

        /* ── PRINT STYLES ── */
        @media print {
            header, .sidebar, #add-subject, button { display: none !important; }
            body { background: #fff !important; color: #000 !important; }
            .container { padding: 0; max-width: 100%; }
            .card { border: none !important; box-shadow: none !important; padding: 0 !important; }
            .subject-card { 
                background: #fff !important; border: 1px solid #eee !important; 
                grid-template-columns: 1fr 60px 60px 60px;
                page-break-inside: avoid;
            }
            .res-card { border: 2px solid #000 !important; margin-top: 20px; display: block !important; }
            .page-title::after { content: " | OFFICIAL GRADE CARD"; font-size: 14px; color: #FF6A00; margin-left: 10px; }
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 14px;
            cursor: pointer; border: none; transition: all .2s var(--sp);
        }
        .bp { background: var(--o); color: #fff; box-shadow: 0 4px 12px rgba(255,106,0,.25); }
        .bs { background: transparent; border: 1.5px solid var(--id); color: var(--o); }
        .btn:hover { transform: translateY(-2px) scale(1.02); }

        @media (max-width: 640px) {
            .subject-card { grid-template-columns: 1fr 1fr; }
            .name-col { grid-column: span 2; }
            input { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <div class="lw"><img src="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770296454/Untitled-2_i2ezfh.png" alt="Gradeo"/></div>
            <span class="bn">GRADEO</span>
        </a>
        <button class="btn bs" style="padding: 8px;"><i data-lucide="user" size="18"></i></button>
    </header>

    <main class="container">
        <header style="border: none; padding: 0; margin-bottom: 2rem; position: relative;">
            <h1 class="page-title">SGPA <span style="color: var(--o);">CALCULATOR</span></h1>
            <p class="page-sub">Enter your subjects and marks to calculate your semester grade point average.</p>
        </header>

        <div class="app-grid">
            <div class="calc-area">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 style="font-weight: 900; font-size: 18px; letter-spacing: -0.5px;">Current Semester</h2>
                        <button class="btn bs" id="add-subject" style="padding: 8px 14px; font-size: 12px;">
                            <i data-lucide="plus" size="14"></i> Add Subject
                        </button>
                    </div>
                    <div id="subject-list"></div>
                </div>
            </div>

            <div class="sidebar">
                <div class="card res-card" style="margin-bottom: 1.5rem;">
                    <div class="res-val" id="sgpa-result">0.00</div>
                    <div class="res-lbl">Semester SGPA</div>
                </div>
                <button class="btn bp" id="share-btn" style="width: 100%; margin-bottom: 10px;">
                    <i data-lucide="share-2" size="18"></i> Share SGPA
                </button>
                <button class="btn bs" id="print-btn" style="width: 100%;">
                    <i data-lucide="printer" size="18"></i> Print Grade Card
                </button>
            </div>
        </div>
    </main>

    <script>
        const state = {
            subjects: [
                { id: 1, name: 'Subject 1', credits: 4, cie: 45, see: 90 },
                { id: 2, name: 'Subject 2', credits: 4, cie: 42, see: 85 }
            ]
        };

        const calcGp = (t) => {
            if(t>=90) return 10; if(t>=80) return 9; if(t>=70) return 8; 
            if(t>=60) return 7; if(t>=50) return 6; if(t>=45) return 5; 
            if(t>=40) return 4; return 0;
        };

        const render = () => {
            const list = document.getElementById('subject-list');
            list.innerHTML = '';
            let tp = 0, tc = 0;

            state.subjects.forEach(s => {
                const tot = s.cie + (s.see / 2);
                const gp = calcGp(tot);
                tp += gp * s.credits; tc += s.credits;

                const card = document.createElement('div');
                card.className = 'subject-card';
                card.innerHTML = `
                    <div class="input-group name-col">
                        <label class="label">Name</label>
                        <input type="text" class="name" value="${s.name}" onchange="upd(${s.id},'name',this.value)">
                    </div>
                    <div class="input-group">
                        <label class="label">Credits</label>
                        <input type="number" value="${s.credits}" onchange="upd(${s.id},'credits',parseFloat(this.value))">
                    </div>
                    <div class="input-group">
                        <label class="label">CIE</label>
                        <input type="number" value="${s.cie}" onchange="upd(${s.id},'cie',parseFloat(this.value))">
                    </div>
                    <div class="input-group">
                        <label class="label">SEE</label>
                        <input type="number" value="${s.see}" onchange="upd(${s.id},'see',parseFloat(this.value))">
                    </div>
                    <button class="btn bs" style="padding: 8px; border: none;" onclick="rem(${s.id})"><i data-lucide="trash-2" size="18" color="#FF4444"></i></button>
                `;
                list.appendChild(card);
            });

            document.getElementById('sgpa-result').innerText = tc ? (tp/tc).toFixed(2) : '0.00';
            lucide.createIcons();
        };

        const upd = (id,f,v) => { state.subjects.find(s=>s.id===id)[f]=v; render(); };
        const rem = (id) => { state.subjects=state.subjects.filter(s=>s.id!==id); render(); };
        
        document.getElementById('add-subject').addEventListener('click', () => {
            state.subjects.push({ id: Date.now(), name: 'New Subject', credits: 4, cie: 40, see: 80 });
            render();
        });

        // ── MODERN ACTIONS ──
        const shareResult = async () => {
            const sgpa = document.getElementById('sgpa-result').innerText;
            const text = `📊 My Semester SGPA on GRADEO is ${sgpa}!\nCalculate yours here: ${window.location.href}`;
            if (navigator.share) {
                try { await navigator.share({ title: 'My SGPA', text: text, url: window.location.href }); } catch(e) {}
            } else {
                navigator.clipboard.writeText(text);
                alert('Result copied to clipboard!');
            }
        };

        document.getElementById('share-btn').addEventListener('click', shareResult);
        document.getElementById('print-btn').addEventListener('click', () => window.print());

        lucide.createIcons();
        render();

        // Theme init
        const theme = localStorage.getItem('gradeo_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>
</html>
