<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
    <title>Target Planner — GRADEO</title>
    <link rel="icon" href="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770296454/Untitled-2_i2ezfh.png" type="image/png"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --o: #FF6A00; --od: #E05500;
            --bg: #FFF6ED; --surface: #fff;
            --text: #0D0C0B; --muted: #6B6560; --muted2: #A8A29E;
            --cb: rgba(255,106,0,.11);
            --ib: rgba(255,130,30,.11); --id: rgba(255,106,0,.18);
            --r: 20px; --r2: 16px;
            --sp: cubic-bezier(.34, 1.56, .64, 1);
        }
        [data-theme="dark"] {
            --bg: #080604; --surface: #161210;
            --text: #F5E8D8; --muted: #8A7E74; --muted2: #5A5450;
            --cb: rgba(255,106,0,.22);
            --ib: rgba(255,106,0,.14); --id: rgba(255,106,0,.28);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; min-height: 100vh; }
        header { position: sticky; top: 0; z-index: 100; background: var(--bg); backdrop-filter: blur(20px); border-bottom: 1px solid var(--cb); padding: 12px 1.5rem; display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
        .lw { width: 32px; height: 32px; border-radius: 10px; overflow: hidden; border: 1.5px solid var(--id); box-shadow: 0 2px 8px rgba(255,106,0,.14); transition: transform .3s var(--sp); }
        .lw:hover { transform: rotate(8deg) scale(1.1); }
        .lw img { width: 100%; height: 100%; object-fit: cover; }
        .bn { font-size: 14px; font-weight: 900; letter-spacing: -.4px; }
        .container { max-width: 1120px; margin: 0 auto; padding: 2rem 1.5rem; }
        .page-title { font-size: clamp(24px, 8vw, 42px); font-weight: 950; letter-spacing: -1.5px; margin-bottom: 8px; }
        .app-grid { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; }
        @media (max-width: 1024px) { .app-grid { grid-template-columns: 1fr; } }
        .card { background: var(--surface); border: 1.5px solid var(--cb); border-radius: var(--r); padding: 1.5rem; }
        .subject-card { background: var(--bg); border: 1.5px solid var(--cb); border-radius: 16px; padding: 1.25rem; margin-bottom: 12px; display: grid; grid-template-columns: 1fr 100px 100px auto; gap: 1rem; align-items: center; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
        input { background: var(--surface); border: 1.5px solid var(--cb); border-radius: 8px; padding: 8px 12px; color: var(--text); font-weight: 700; font-size: 14px; width: 100%; outline: none; }
        input:focus { border-color: var(--o); }
        .res-card { background: linear-gradient(135deg, var(--surface), var(--bg)); text-align: center; padding: 2.5rem 1.5rem; }
        .res-val { font-size: 4.5rem; font-weight: 950; color: var(--o); letter-spacing: -3px; line-height: 1; }
        .res-lbl { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-top: 8px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; border: none; transition: all .2s var(--sp); }
        .bp { background: var(--o); color: #fff; box-shadow: 0 4px 12px rgba(255,106,0,.25); }
        .bs { background: transparent; border: 1.5px solid var(--id); color: var(--o); }
        .req-tag { background: rgba(255,106,0,.08); color: var(--o); padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 900; }
        @media (max-width: 640px) { .subject-card { grid-template-columns: 1fr 1fr; } .name-col { grid-column: span 2; } }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">
            <div class="lw"><img src="https://res.cloudinary.com/djy3mjtsz/image/upload/v1770296454/Untitled-2_i2ezfh.png" alt="Gradeo"/></div>
            <span class="bn">GRADEO</span>
        </a>
        <button class="btn bs" style="padding: 8px;"><i data-lucide="user" size="18"></i></button>
    </header>
    <main class="container">
        <h1 class="page-title">TARGET <span style="color: var(--o);">PLANNER</span></h1>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 2rem;">Calculate the minimum marks you need in final exams.</p>
        <div class="app-grid">
            <div class="calc-area">
                <div class="card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h2 style="font-weight: 900; font-size: 18px;">Upcoming Exams</h2>
                        <button class="btn bs" id="add-sub" style="padding: 8px 14px; font-size: 12px;"><i data-lucide="plus" size="14"></i> Add Subject</button>
                    </div>
                    <div id="sub-list"></div>
                </div>
            </div>
            <div class="sidebar">
                <div class="card res-card" style="margin-bottom: 1.5rem;">
                    <div class="res-val" id="result">0.00</div>
                    <div class="res-lbl">Predicted SGPA</div>
                </div>
                <div class="card">
                    <label class="label">Target CGPA</label>
                    <input type="number" step="0.1" value="9.0" id="target" onchange="render()" style="margin-top: 6px;">
                    <div id="summary" style="font-size: 13px; color: var(--muted); margin-top: 1rem; line-height: 1.6;"></div>
                </div>
            </div>
        </div>
    </main>
    <script>
        const state = { subjects: [{ id: 1, name: 'Eng. Math', credits: 4, cie: 42 }] };
        const calcReq = (cie, tg) => {
            const minT = tg === 10 ? 90 : (tg + 3) * 10;
            return Math.max(40, Math.min(100, (minT - cie) * 2));
        };
        const render = () => {
            const list = document.getElementById('sub-list'); list.innerHTML = '';
            const tg = parseFloat(document.getElementById('target').value);
            state.subjects.forEach(s => {
                const req = calcReq(s.cie, Math.floor(tg));
                const card = document.createElement('div'); card.className = 'subject-card';
                card.innerHTML = `<div class="name-col"><label class="label">Subject</label><input type="text" value="${s.name}" onchange="upd(${s.id},'name',this.value)"></div><div class="input-group"><label class="label">Credits</label><input type="number" value="${s.credits}" onchange="upd(${s.id},'credits',parseFloat(this.value))"></div><div class="input-group"><label class="label">CIE (50)</label><input type="number" value="${s.cie}" onchange="upd(${s.id},'cie',parseFloat(this.value))"></div><div style="text-align: right;"><label class="label">Req. SEE</label><div class="req-tag">${req}/100</div></div>`;
                list.appendChild(card);
            });
            document.getElementById('summary').innerHTML = `To reach <b>${tg} CGPA</b>, aim for <b>${Math.floor(tg)} Grade Points</b> per subject.`;
            lucide.createIcons();
        };
        const upd = (id,f,v) => { state.subjects.find(s=>s.id===id)[f]=v; render(); };
        document.getElementById('add-sub').addEventListener('click', () => { state.subjects.push({ id: Date.now(), name: 'New Subject', credits: 4, cie: 40 }); render(); });
        lucide.createIcons(); render();
        const theme = localStorage.getItem('gradeo_theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
</body>
</html>
